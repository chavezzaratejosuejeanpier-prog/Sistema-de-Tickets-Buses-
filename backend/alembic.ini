# Configuración mínima para usar la CLI `alembic` desde backend/
# (p. ej. `alembic history` o `alembic revision -m "..."`).
# Para aplicar migraciones usa `python migrar.py`: abre una única
# transacción con bloqueo y no imprime la URL de la base.
# La URL se toma de DATABASE_URL (entorno o backend/.env), nunca de aquí.

[alembic]
script_location = %(here)s/alembic_migraciones
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
