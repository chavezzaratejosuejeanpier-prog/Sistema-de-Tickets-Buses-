<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'dark' && t !== 'light') t = 'dark'
          if (t === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <meta
      name="description"
      content="LUX - Líneas Únicas Xpress: compra pasajes de bus en línea. Busca rutas a nivel nacional, elige tu asiento y reserva en minutos."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
    }
  </script>
    <meta name="theme-color" content="#0F172A" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LUX - Líneas Únicas Xpress" />
    <meta property="og:title" content="LUX - Líneas Únicas Xpress - Venta de Pasajes" />
    <meta property="og:description" content="Busca rutas a nivel nacional, elige tu asiento y reserva tu pasaje de bus en minutos." />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>LUX - Líneas Únicas Xpress - Venta de Pasajes</title>
  </head>
  <body class="bg-surface">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Filtros SVG de daltonismo -->
    <svg style="display: none;">
      <filter id="filtro-protanopia">
        <feColorMatrix type="matrix" values="0.567, 0.433, 0, 0, 0
          0.558, 0.442, 0, 0, 0
          0, 0.242, 0.758, 0, 0
          0, 0, 0, 1, 0" />
      </filter>
      <filter id="filtro-deuteranopia">
        <feColorMatrix type="matrix" values="0.625, 0.375, 0, 0, 0
          0.7, 0.3, 0, 0, 0
          0, 0.3, 0.7, 0, 0
          0, 0, 0, 1, 0" />
      </filter>
      <filter id="filtro-tritanopia">
        <feColorMatrix type="matrix" values="0.95, 0.05, 0, 0, 0
          0, 0.433, 0.567, 0, 0
          0, 0.475, 0.525, 0, 0
          0, 0, 0, 1, 0" />
      </filter>
    </svg>
  </body>
</html>
